study:
  name: lr0_search
  storage: sqlite:///optuna.db
  direction: maximize
  sampler: TPE
  sampler_seed: 42
  pruner:
    name: MedianPruner
    n_startup_trials: 5
    n_warmup_steps: 5

fixed:
  split_seed: 0
  seed: 0
  epochs: 30

search_space:
  lr:
    type: float
    low: 0.0001
    high: 0.1
    log: true
  n_layers:
    type: int
    low: 1
    high: 3
  hidden:
    type: int
    low: 32
    high: 512
    log: true
  dropout:
    type: float
    low: 0.0
    high: 0.5
  weight_decay:
    type: float
    low: 0.000001
    high: 0.01
    log: true
  batch_size:
    type: categorical
    choices:
      - 32
      - 64
      - 128
